<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- всё грузится только с самого сайта; фото и шрифт никуда не отправляются -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
<title>inkfont — твой почерк как шрифт</title>
<meta name="description" content="Напиши три строчки от руки, сфотографируй — получи готовый шрифт .otf за минуту.">
<link rel="preload" href="fonts/GeneralSans-Regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/GeneralSans-Semibold.woff2" as="font" type="font/woff2" crossorigin>
<style>
  @font-face{font-family:'General Sans';src:url('fonts/GeneralSans-Regular.woff2') format('woff2');font-weight:400;font-style:normal;font-display:swap}
  @font-face{font-family:'General Sans';src:url('fonts/GeneralSans-Semibold.woff2') format('woff2');font-weight:600;font-style:normal;font-display:swap}
  /* Manrope — кириллица вместо General Sans; Neucha — рукописный образец на «листе». Все шрифты лежат на сайте:
     браузер посетителя не ходит ни в Google, ни на другие чужие серверы */
  @font-face{font-family:'Manrope';src:url('fonts/Manrope-cyrillic.woff2') format('woff2');font-weight:400 600;font-display:swap;unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
  @font-face{font-family:'Neucha';src:url('fonts/Neucha-latin.woff2') format('woff2');font-display:swap;unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+2000-206F,U+20AC,U+2122,U+2212}
  @font-face{font-family:'Neucha';src:url('fonts/Neucha-cyrillic.woff2') format('woff2');font-display:swap;unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
  :root{
    --ink:#1b1d18;       /* тёплый почти чёрный */
    --soft:#6f7268;
    --faint:#a6a89f;
    --line:#e9e9e3;
    --mist:#f5f5f0;
    --paper:#ffffff;
    --moss:#3f5a2c;      /* мох с фото */
    --warn:#a65d26;
    --display:'General Sans','Manrope',-apple-system,BlinkMacSystemFont,sans-serif;
    --text:'General Sans','Manrope',-apple-system,BlinkMacSystemFont,sans-serif;
    --radius:22px;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  html,body{margin:0;background:var(--paper);color:var(--ink)}
  body{font:400 17px/1.55 var(--text);-webkit-font-smoothing:antialiased;font-synthesis:none}
  a{color:inherit}
  b{font-weight:600;color:var(--ink)}
  .wrap{max-width:1040px;margin:0 auto;padding:0 24px}
  .display{font-family:var(--display);font-weight:600}

  /* навигация: только название и кнопка поверх фото, без подложки; уезжает вместе с первым экраном */
  nav{position:absolute;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:26px clamp(20px,4vw,44px);color:#fff}
  /* логотип — надпись от руки, белая, с живыми краями чернил */
  .logo{display:block;line-height:0}
  .logo img{width:clamp(90px,8vw,112px);height:auto;filter:drop-shadow(0 1px 10px rgba(14,18,10,.3))}
  .nav-r{display:flex;align-items:center;gap:18px}
  .lang{border:0;background:none;color:#fff;font:inherit;font-size:15px;letter-spacing:.06em;cursor:pointer;opacity:.85;padding:6px 2px}
  .lang:hover{opacity:1}
  nav a.go{font-size:15px;text-decoration:none;padding:11px 20px;border-radius:999px;background:#fff;color:var(--ink);transition:opacity .2s}
  nav a.go:hover{opacity:.9}

  /* первый экран */
  .hero{position:relative;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff;padding:104px 20px 36px;
        background:#5d7a3a url('assets/hero-1200.jpg') center 70%/cover no-repeat;overflow:hidden}
  @media (min-width:1200px){.hero{background-image:url('assets/hero.jpg')}}
  .hero::before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(14,18,10,.55) 0%,rgba(14,18,10,.15) 45%,rgba(14,18,10,.05) 70%,rgba(14,18,10,.25) 100%)}
  .hero>*{position:relative}
  .hero>nav{position:absolute}
  /* размер заголовка зависит и от ширины, и от высоты окна — весь первый экран помещается без прокрутки */
  h1{font-family:var(--display);font-weight:600;font-size:clamp(40px,min(7.4vw,11svh),108px);line-height:.98;letter-spacing:-.035em;margin:0 0 22px}
  /* «your font» — от руки: высота строчных совпадает с набранной строкой, петли y и f выходят за строку, не раздвигая заголовок */
  h1 .hand-img{display:block;width:3.4em;height:auto;margin:-.06em auto -.22em;filter:drop-shadow(0 1px 10px rgba(14,18,10,.22))}
  .lead{font-size:clamp(16px,1.6vw,19px);max-width:520px;margin:0 auto 22px;opacity:.92}
  /* кнопка вниз: белая стрелка в круге, нарисованном от руки (без подложки) */
  .ring-down{position:relative;width:80px;height:75px;display:grid;place-items:center;color:#fff;text-decoration:none}
  .ring-down .ring{position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(0 1px 8px rgba(14,18,10,.25))}
  .ring-down svg{position:relative;filter:drop-shadow(0 1px 6px rgba(14,18,10,.3))}
  /* при наведении сдвигаются кольцо и стрелка, а не сама ссылка: зона наведения стоит на месте и не дёргается у края;
     will-change держит их отдельным слоем, чтобы после возврата они не прыгали ещё раз на полпикселя */
  .ring-down>*{transition:transform .25s;will-change:transform}
  .ring-down:hover>*{transform:translateY(3px)}
  .hero .demo{margin-top:12px;background:none;border:0;color:#fff;font:inherit;font-size:15px;opacity:.9;cursor:pointer;text-decoration:underline;text-underline-offset:4px}

  /* кнопки */
  .btn{appearance:none;border:0;border-radius:999px;background:var(--ink);color:#fff;font:inherit;font-size:16px;padding:13px 26px;cursor:pointer;transition:transform .15s,opacity .2s}
  .btn:hover{opacity:.88}
  .btn:active{transform:scale(.98)}
  .btn.ghost{background:transparent;color:var(--ink);padding:13px 16px;text-decoration:underline;text-underline-offset:4px;text-decoration-color:var(--faint)}
  .btn[disabled]{opacity:.35;cursor:default}

  /* шаги */
  section.step{padding:128px 0 0}
  section.step:last-of-type{padding-bottom:128px}
  /* номер шага — огромная светлая цифра в углу блока, за содержимым */
  section.step .wrap{position:relative}
  section.step .wrap>*:not(.num){position:relative;z-index:1}
  section.step .num{position:relative;z-index:0}
  .num{display:block;text-align:right;font-family:var(--display);font-weight:600;font-size:clamp(140px,22vw,300px);line-height:.74;
       letter-spacing:-.06em;color:var(--ink);margin:0 -.03em .1em 0;pointer-events:none;user-select:none}
  h2{font-family:var(--display);font-weight:600;font-size:clamp(38px,5.8vw,68px);line-height:1.02;letter-spacing:-.03em;margin:0 0 18px}
  .sub{color:var(--soft);font-size:18px;max-width:560px;margin:0 0 40px}

  .seg{display:inline-flex;gap:4px;margin-bottom:24px;flex-wrap:wrap}
  .seg button{border:1px solid var(--line);background:#fff;font:inherit;font-size:15px;padding:8px 16px;border-radius:999px;color:var(--soft);cursor:pointer}
  .seg button.on{background:var(--ink);border-color:var(--ink);color:#fff}

  .card{background:var(--mist);border-radius:var(--radius);padding:28px}
  .sheet{border:1px solid var(--line);border-radius:var(--radius);padding:24px 30px;
         font-family:'Neucha',cursive;font-size:clamp(20px,2.8vw,28px);line-height:1.9;color:var(--ink);
         /* линовка как в тетради: линия под буквами (линия строки Neucha ≈ 1.19em от верха строки), над заглавными — воздух */
         background:#fff repeating-linear-gradient(transparent 0 1.24em, var(--line) 1.24em calc(1.24em + 1px), transparent calc(1.24em + 1px) 1.9em) 0 24px/100% calc(100% - 48px) no-repeat}
  /* без all:unset — в Safari он выключает ввод текста */
  .sheet textarea{appearance:none;border:0;outline:none;background:transparent;margin:0;padding:0;font:inherit;color:inherit;resize:none;box-shadow:none;display:block;width:100%;line-height:inherit;white-space:pre-wrap;min-height:5em;overflow:hidden}
  .tips{margin:18px 0 0;font-size:15px;color:var(--soft)}

  /* зона загрузки: label по умолчанию строчный, без display:block рамка рвётся */
  .drop{display:block;border:1px dashed var(--faint);border-radius:var(--radius);padding:64px 20px;text-align:center;background:var(--mist);cursor:pointer;transition:border-color .2s,background .2s}
  .drop:hover,.drop.over{border-color:var(--ink);background:#fff}
  .drop .t{font-size:19px}
  .drop p{margin:6px 0 0;color:var(--soft);font-size:15px}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center;margin-top:18px}

  #scanWrap{margin-top:28px;display:none}
  .scanbox{position:relative}
  .chip{display:inline-block;margin:0 0 10px;padding:6px 12px;border-radius:999px;background:var(--ink);color:#fff;font-size:13px}
  .demo-cta{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:24px;padding:22px 26px;border-radius:var(--radius);background:var(--mist);color:var(--soft)}
  #scan{width:100%;height:auto;border-radius:16px;background:#fff;border:1px solid var(--line)}
  .status{margin-top:14px;font-size:15px;color:var(--soft)}
  .status.ok{color:var(--moss)} .status.warn{color:var(--warn)}
  /* текст на листе не совпал с выбранным — объясняем и даём кнопку */
  .mismatch{margin-top:14px;padding:16px 18px;border-radius:14px;background:#fbf3ea;border:1px solid #ecd6bf;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  .mismatch p{margin:0;flex:1 1 260px;font-size:15px;color:var(--ink)}
  /* проверка цифр: куски с листа, которые сайт принял за 0–9 */
  .dc-tiles{display:flex;flex-wrap:wrap;gap:6px;flex:1 1 100%}
  .dc-tiles figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:2px}
  .dc-tiles canvas{border:1px solid var(--line);border-radius:8px;background:#fff}
  .dc-tiles figcaption{font-size:12px;color:var(--soft)}
  .dc-btns{display:flex;gap:8px;flex-wrap:wrap}
  /* работа восстановлена с этого устройства; кнопка «удалить» — как ссылка */
  .saved{margin:12px 0 0;font-size:14px;color:var(--soft)}
  .link{appearance:none;border:0;background:none;padding:0;font:inherit;color:var(--ink);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
  /* оплата: сообщение под кнопкой; после оплаты цена и подпись не нужны */
  .pay-msg{margin:12px 0 0;font-size:15px;color:var(--soft);min-height:1.4em}
  .pay-msg.ok{color:var(--moss)} .pay-msg.warn{color:var(--warn)}
  .buy.paid .price,.buy.paid small{display:none}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
  .tile{position:relative;aspect-ratio:1;background:#fff;border-radius:14px;display:flex;align-items:center;justify-content:center;cursor:pointer;border:1px solid var(--line);transition:transform .12s,border-color .2s}
  .tile:hover{transform:translateY(-1px);border-color:var(--faint)}
  .tile .g{font-size:34px;line-height:1}
  .tile .gc{position:absolute;inset:0;width:100%;height:100%;border-radius:inherit}
  .tile .k{position:absolute;left:7px;top:5px;font-size:10px;color:var(--soft)}
  .tile .n{position:absolute;right:7px;bottom:5px;font-size:10px;color:var(--soft)}
  .tile.auto{border-style:dashed}
  .tile.miss{background:#faf3ec;border-color:#efdcc9;cursor:default}
  .legend{font-size:13px;color:var(--soft);margin:14px 0 0}

  .preview{border:1px solid var(--line);border-radius:var(--radius);padding:28px 30px}
  .preview{cursor:text}
  /* запас сверху и снизу: у рукописных букв крючки и хвосты выходят за строку */
  #previewText{appearance:none;border:0;outline:none;background:transparent;margin:0;padding:0;font:inherit;color:inherit;resize:none;box-shadow:none;display:block;width:100%;min-height:2.4em;font-size:56px;line-height:1.5;padding:.35em 0 .3em;color:var(--ink);overflow:hidden;word-break:break-word}
  .controls{display:flex;gap:22px;align-items:center;flex-wrap:wrap;margin-top:20px;font-size:15px;color:var(--soft)}
  .controls input[type=text]{font:inherit;color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:9px 12px;min-width:200px}
  .controls input[type=range]{accent-color:var(--ink)}
  .buy{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:24px;padding:26px 30px;border-radius:var(--radius);background:var(--mist)}
  .buy .price{font-family:var(--display);font-weight:600;font-size:48px;line-height:1;letter-spacing:-.03em}
  .buy small{display:block;color:var(--soft);font-size:14px;margin-top:6px}
  footer{padding:48px 0 64px;color:var(--soft);font-size:13px;text-align:center}

  /* окно правки буквы */
  .modal{position:fixed;inset:0;z-index:50;background:rgba(20,22,18,.35);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;padding:16px}
  .ed-card{background:#fff;border-radius:var(--radius);padding:24px 26px;width:100%;max-width:688px;max-height:calc(100vh - 32px);overflow:auto;box-shadow:0 20px 60px rgba(20,22,18,.25)}
  .ed-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px}
  .ed-title{font-family:var(--display);font-weight:600;font-size:30px;line-height:1;letter-spacing:-.02em}
  .ed-title .ch{font-family:var(--userfont,'Neucha'),cursive;font-style:normal;margin-left:6px}
  .ed-sub{font-size:14px;color:var(--soft);margin-top:6px}
  .ed-x{border:0;background:var(--mist);width:34px;height:34px;border-radius:50%;font-size:20px;line-height:1;color:var(--ink);cursor:pointer;flex:none}
  .ed-stage{background:var(--mist);border-radius:16px;padding:10px;display:flex;justify-content:center}
  #edCanvas{display:block;cursor:ew-resize;touch-action:none;border-radius:8px;max-width:100%}
  .ed-hint{font-size:13px;color:var(--soft);margin:10px 0 0}
  .ed-row{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:14px;flex-wrap:wrap}
  .ed-variants{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--soft)}
  .ed-variants button{border:1px solid var(--line);background:#fff;width:34px;height:34px;border-radius:50%;font-size:18px;color:var(--ink);cursor:pointer}
  .ed-variants button[disabled]{opacity:.35;cursor:default}
  #edGlyph{border:1px solid var(--line);border-radius:12px}
  .ed-actions{display:flex;justify-content:flex-end;gap:6px;flex-wrap:wrap;margin-top:18px}
  .ed-actions .btn{font-size:15px;padding:10px 20px}
  .ed-actions .btn.ghost{padding:10px 12px}

  /* окно демо: три шага подряд, без прыжков по странице */
  .demo-card{background:#fff;border-radius:var(--radius);padding:24px 26px 26px;width:100%;max-width:560px;max-height:calc(100svh - 32px);overflow:auto;box-shadow:0 20px 60px rgba(20,22,18,.25)}
  .demo-title{font-family:var(--display);font-weight:600;font-size:26px;letter-spacing:-.02em;line-height:1.1}
  .demo-step{display:flex;align-items:center;gap:10px;margin:18px 0 10px;font-size:15px;color:var(--soft)}
  .demo-n{font-family:var(--display);font-weight:600;font-size:22px;color:var(--ink);line-height:1}
  .demo-sheet{display:block;width:100%;border-radius:14px;border:1px solid var(--line)}
  .demo-letters{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
  .demo-letters .tile{cursor:default}
  .demo-letters .tile:hover{transform:none}
  .demo-type{min-height:2.6em;font-size:34px;line-height:1.3;color:var(--ink);padding:14px 16px;border:1px solid var(--line);border-radius:14px;word-break:break-word}
  .demo-go{width:100%;margin-top:20px}
  @media (max-width:600px){ .demo-card{border-radius:22px 22px 0 0;max-height:94svh;padding:20px 16px calc(20px + env(safe-area-inset-bottom))} .demo-type{font-size:28px} }
  .hidden{display:none!important}
  @media (max-width:600px){
    nav{padding:20px} .nav-r{gap:12px} nav a.go{padding:10px 16px}
    h1{font-size:min(14vw,8.5svh)}
    section.step{padding-top:88px} section.step:last-of-type{padding-bottom:88px}
    #previewText{font-size:40px} .card,.preview,.buy{padding:20px} .sheet{padding:18px 20px}
    .modal{align-items:flex-end;padding:0} .ed-card{border-radius:22px 22px 0 0;max-height:92vh;padding:20px 16px}
  }
</style>
</head>
<body>
<header class="hero" id="top">
  <nav>
    <a class="logo" href="#top"><img src="assets/inkfont.png" width="944" height="598" alt="inkfont"></a>
    <div class="nav-r">
      <button class="lang" id="langBtn"></button>
      <a class="go" href="#write" data-i18n="navGo">Создать шрифт</a>
    </div>
  </nav>
  <h1>Your handwriting,<br><img class="hand-img" src="assets/your-font.png" width="1062" height="534" alt="your font."></h1>
  <p class="lead" data-i18n="lead"></p>
  <a class="ring-down" href="#write" data-i18n-aria="startAria">
    <img class="ring" src="assets/ring.png" width="500" height="470" alt="">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v16M5 13l7 7 7-7"/></svg>
  </a>
  <button class="demo" id="demoTop" data-i18n="demoTop"></button>
</header>

<section class="step" id="write"><div class="wrap">
  <div class="num" aria-hidden="true">1</div>
  <h2 data-i18n="s1h"></h2>
  <p class="sub" data-i18n="s1sub"></p>
  <div class="seg" id="scriptSeg">
    <button data-s="latin" class="on" data-i18n="segLatin"></button>
    <button data-s="cyrillic" data-i18n="segCyr"></button>
    <button data-s="both" data-i18n="segBoth"></button>
    <button data-s="own" data-i18n="segOwn"></button>
  </div>
  <div class="sheet"><textarea id="expected" spellcheck="false" readonly></textarea></div>
  <p class="tips" data-i18n="tips"></p>
</div></section>

<section class="step" id="upload"><div class="wrap">
  <div class="num" aria-hidden="true">2</div>
  <h2 data-i18n="s2h"></h2>
  <p class="sub" data-i18n="s2sub"></p>
  <label class="drop" id="drop">
    <input type="file" id="file" accept="image/*" hidden>
    <div class="t" data-i18n="dropT"></div>
    <p data-i18n="dropP"></p>
  </label>
  <div class="row"><button class="btn ghost" id="demoBtn" data-i18n="demoBtn"></button></div>
  <div id="scanWrap">
    <div class="scanbox"><span class="chip hidden" id="demoChip" data-i18n="demoChip"></span><canvas id="scan"></canvas></div>
    <div class="status" id="status"></div>
    <div class="mismatch hidden" id="mismatch" role="alert"><p></p><button class="btn" id="mismatchBtn" data-i18n="mmBtn"></button></div>
    <div class="mismatch hidden" id="digitCheck"><p data-i18n="dcQ"></p><div class="dc-tiles" id="dcTiles"></div>
      <div class="dc-btns"><button class="btn ghost" id="dcYes" data-i18n="dcYes"></button><button class="btn" id="dcNo" data-i18n="dcNo"></button></div></div>
    <p class="saved hidden" id="saved"><span data-i18n="restored"></span> <button class="link" id="delWork" data-i18n="delWork"></button></p>
  </div>
</div></section>

<section class="step hidden" id="review"><div class="wrap">
  <div class="num" aria-hidden="true">3</div>
  <h2 data-i18n="s3h"></h2>
  <p class="sub" data-i18n="s3sub"></p>
  <div class="card"><div class="grid" id="grid"></div>
    <p class="legend" data-i18n="legend"></p>
  </div>
</div></section>

<section class="step hidden" id="result"><div class="wrap">
  <div class="num" aria-hidden="true">4</div>
  <h2 data-i18n="s4h"></h2>
  <p class="sub" data-i18n="s4sub"></p>
  <div class="preview">
    <textarea id="previewText" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off" rows="2" aria-label="Preview">Hello, world! This is my handwriting.</textarea>
  </div>
  <div class="controls">

<script>
  applyLang();
  // ссылки внутри страницы прокручивают плавно и не пишут #якорь в адрес —
  // иначе при обновлении браузер сам уезжает к шагу; после загрузки страница всегда сверху
  document.querySelectorAll('a[href^="#"]').forEach(a => a.addEventListener('click', e => {
    const target = document.querySelector(a.getAttribute('href'));
    if (!target) return;
    e.preventDefault();
    target.scrollIntoView({ behavior: 'smooth' });
  }));
  if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
  if (location.hash) history.replaceState(null, '', location.pathname + location.search);
  window.scrollTo(0, 0);
</script>
